[package]
name = "adm-p6-tauri"
version = "0.1.0"
description = "ADM P6 migration target in Rust/Tauri"
authors = ["ADM P6"]
edition = "2021"

[lib]
name = "adm_p6_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adm-p6-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Diálogo nativo de "salvar como". No WebView o `<a download>` não define
# destino nem abre seletor — ver src/files/commands.rs.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2"
bcrypt = "0.16"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dotenvy = "0.15"
regex = "1"


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
# `test` habilita tauri::test::mock_builder, que roda os comandos por IPC de
# verdade — guards, desserialização e envelope inclusos. Só em teste.
tauri = { version = "2", features = ["test"] }
